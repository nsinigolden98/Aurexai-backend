<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#F9FAFB;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F9FAFB;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#FFFFFF;border-radius:16px;overflow:hidden;border:1px solid #E5E7EB;">
          <tr>
            <td style="padding:32px 32px 16px;background:#111827;">
              <div style="color:#FFFFFF;font-size:24px;font-weight:700;letter-spacing:0.3px;">Aurexai</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px;color:#111827;font-size:24px;line-height:32px;">{{ title }}</h1>
              <p style="margin:0 0 16px;color:#374151;font-size:16px;line-height:24px;">Hi {{ name }},</p>
              {{ content | safe }}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#F9FAFB;border-top:1px solid #E5E7EB;">
              <p style="margin:0;color:#6B7280;font-size:12px;line-height:18px;">&copy; {{ year }} Aurexai. All rights reserved.</p>
              <p style="margin:8px 0 0;color:#9CA3AF;font-size:12px;line-height:18px;">This is an automated message, please do not share sensitive codes or links with anyone.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
